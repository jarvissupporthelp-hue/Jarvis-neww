name: CI

on:
  pull_request:
  push:
    branches: [main, Vagharshak, integration/ara-vagharshak]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke and route integration tests
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/jarvis-integration-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/jarvis-integration-server.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ > /dev/null || { cat /tmp/jarvis-integration-server.log; exit 1; }
          npm run test:e2e
