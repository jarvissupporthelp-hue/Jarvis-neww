name: Repair npm lockfile (one-time)

on:
  push:
    branches: [feature/integrate-arena-portal-20261119]
    paths: [.github/workflows/repair-npm-lock.yml]

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore missing optional platform dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
          npm ci --include=optional
      - name: Commit corrected lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package metadata."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: restore optional npm platform dependencies to lockfile"
            git push origin HEAD:refs/heads/feature/integrate-arena-portal-20261119
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
